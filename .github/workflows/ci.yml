name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: cortes_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: dotnet test cortes-ia-api/Tests/Cortes.Tests.csproj --configuration Release
        env:
          TEST_DATABASE_URL: Host=localhost;Database=cortes_test;Username=test;Password=test
      - run: dotnet list cortes-ia-api/Cortes.Api.csproj package --vulnerable --include-transitive
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --package-lock-only && npm ci && npm run typecheck && npm run build
        working-directory: cortes-ia-web
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
        working-directory: cortes-ia-workers
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: '.', severity: 'CRITICAL,HIGH', exit-code: '1'}
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false && terraform validate
        working-directory: cortes-ia-infra/terraform

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: cortes_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d cortes_test" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: dotnet tool restore
      - run: dotnet build cortes-ia-api/Cortes.Api.csproj --configuration Release
      - name: Apply EF migrations to fresh PostgreSQL
        run: dotnet ef database update --project cortes-ia-api/Cortes.Api.csproj --no-build --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Database: Host=localhost;Database=cortes_test;Username=test;Password=test
          CPF_HMAC_KEY: 0123456789012345678901234567890123456789
          WORKER_TOKEN: 0123456789012345678901234567890123456789
      - name: Roll back EF migrations to zero
        run: dotnet ef database update 0 --project cortes-ia-api/Cortes.Api.csproj --no-build --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Database: Host=localhost;Database=cortes_test;Username=test;Password=test
          CPF_HMAC_KEY: 0123456789012345678901234567890123456789
          WORKER_TOKEN: 0123456789012345678901234567890123456789
      - name: Fail on model/migration drift
        run: dotnet ef migrations has-pending-model-changes --project cortes-ia-api/Cortes.Api.csproj --no-build --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Database: Host=localhost;Database=cortes_test;Username=test;Password=test
          CPF_HMAC_KEY: 0123456789012345678901234567890123456789
          WORKER_TOKEN: 0123456789012345678901234567890123456789

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser/media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd cortes-ia-web
          npm install --package-lock-only
          npm ci
          npx playwright install --with-deps chromium
      - name: Bootstrap local secrets
        run: python scripts/bootstrap.py
      - name: Start deterministic SliceFlow stack
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build
      - name: Wait for web
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f compose.yaml -f compose.e2e.yaml ps
          exit 1
      - name: Browser to worker/storage E2E
        working-directory: cortes-ia-web
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          MAILPIT_URL: http://127.0.0.1:8025
        run: npm run e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            cortes-ia-web/playwright-report
            cortes-ia-web/test-results
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.e2e.yaml logs --no-color --tail=500
      - name: Stop E2E stack
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v --remove-orphans
